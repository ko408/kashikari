<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貸し借りメモ</title>
<meta name="description" content="貸したお金・借りたお金と返済を記録するメモ">
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="貸し借り">
<style>
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Concept: a friend-to-friend ledger. Teal means money coming back to you, amber means money you owe,
   buttons stay neutral ink, and every amount is set in a mono face like a ledger column. */
:root{
  --bg:#f2f5f3;
  --surface:#ffffff;
  --surface-2:#e8eeeb;
  --fg:#13211e;
  --muted:#5a6b66;
  --line:#d8e1dd;
  --lent:#09685b;
  --lent-soft:#d9f0ea;
  --borrow:#9a4a08;
  --borrow-soft:#fbe9d4;
  --danger:#b3232a;
  --danger-soft:#fbe1e1;
  --primary:#13211e;
  --on-primary:#ffffff;
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614;--surface:#16211e;--surface-2:#1f2d29;--fg:#e8f0ed;--muted:#97aca5;--line:#2a3b36;
    --lent:#4fd1b8;--lent-soft:#12332d;--borrow:#f0a35c;--borrow-soft:#3a2713;
    --danger:#ff8f8f;--danger-soft:#3d1a1a;--primary:#e8f0ed;--on-primary:#0e1614;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614;--surface:#16211e;--surface-2:#1f2d29;--fg:#e8f0ed;--muted:#97aca5;--line:#2a3b36;
  --lent:#4fd1b8;--lent-soft:#12332d;--borrow:#f0a35c;--borrow-soft:#3a2713;
  --danger:#ff8f8f;--danger-soft:#3d1a1a;--primary:#e8f0ed;--on-primary:#0e1614;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-block:12px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + summary */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px 14px}
.top h1{font-size:22px;font-weight:700;letter-spacing:.04em}
.today{color:var(--muted);font-size:13px;font-family:var(--font-num);font-weight:500}
.summary{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;
}
.sum-col{min-width:0}
.sum-col .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.sum-col .amt{font-family:var(--font-num);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:2px}
.sum-col .sub{font-size:12px;color:var(--muted)}
.sum-col.lent .amt{color:var(--lent)}
.sum-col.borrowed .amt{color:var(--borrow)}
.sum-col .amt.dim{color:var(--muted)}
.sum-net{grid-column:1 / -1;border-top:1px dashed var(--line);padding-top:10px;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:14px}
.net-l{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em}
.net-v{font-weight:700;min-width:0}
.net-v.lent{color:var(--lent)}
.net-v.borrowed{color:var(--borrow)}
.net-v b{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums}

.due{margin-top:12px;background:var(--surface);border:1px solid var(--fg);border-radius:var(--r);padding:6px 6px 8px}
.due-h{display:flex;align-items:baseline;gap:8px;margin:8px 8px 2px;font-size:13px;font-weight:700;letter-spacing:.06em}
.due-h span{font-family:var(--font-num);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted)}
.due-row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 8px;border:0;border-radius:10px;background:transparent;text-align:left}
.due-row:active{background:var(--surface-2)}
.due-t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-row .rem{font-size:16px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.banner p{min-width:0;flex:1 1 160px}

/* controls */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:18px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"],.chip[aria-expanded="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cal-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.cal-row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cal-row .cd{flex:1;min-width:0;font-weight:700}
.cal-row .cd small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.cal-row a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.cal-row .rm{flex:none;width:40px;height:40px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);border-radius:10px}
.cal-links{margin-top:6px}
.chip.person{color:var(--fg);border-color:var(--fg)}

/* lists */
.sec{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sec span{font-family:var(--font-num);font-weight:500;letter-spacing:0}
.list{display:grid;gap:10px}
.loan,.person-row{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 14px 12px;
}
.loan > span{display:block}
.l-top{display:flex !important;align-items:center;gap:10px;min-width:0}
.tag{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:8px;font-size:13px;font-weight:700}
.tag.lent{background:var(--lent-soft);color:var(--lent)}
.tag.borrowed{background:var(--borrow-soft);color:var(--borrow)}
.who{flex:1;min-width:0;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem{font-family:var(--font-num);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dir-lent .rem{color:var(--lent)}
.dir-borrowed .rem{color:var(--borrow)}
.loan.done{opacity:.72}
.loan.done .rem{font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--muted)}
.l-sub{display:flex !important;justify-content:space-between;gap:10px;margin-top:4px;color:var(--muted);font-size:13px;min-width:0}
.l-sub .note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-sub .date{flex:none;font-family:var(--font-num);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--lent)}
.dir-borrowed .bar i,.bar.borrowed i{background:var(--borrow)}
.l-foot{display:flex !important;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.over{background:var(--danger-soft);color:var(--danger)}
.pill.soon{background:var(--surface-2);color:var(--fg)}

.person-row{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
.p-main{flex:1;min-width:0;display:block}
.p-main .who{display:block}
.p-sub{display:block;font-size:12px;color:var(--muted)}
.p-net{flex:none;text-align:right;display:block}
.p-net b{display:block;font-family:var(--font-num);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.p-net small{display:block;font-size:11px;color:var(--muted)}
.p-net.lent b{color:var(--lent)}
.p-net.borrowed b{color:var(--borrow)}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;margin-top:18px;display:grid;gap:10px;justify-items:start}
.empty h2{font-size:17px;text-wrap:balance}
.empty p{color:var(--muted);font-size:14px;max-width:34em}
.empty .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.skel{display:grid;gap:10px;margin-top:22px}
.skel div{height:74px;border-radius:var(--r);background:var(--surface-2)}
.foot{margin:26px 2px 0;font-size:12px;color:var(--muted);max-width:40em}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.fab{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;
  min-height:54px;padding:0 26px;border-radius:999px;border:0;background:var(--primary);color:var(--on-primary);
  font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;
}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,16,14,.5);z-index:20}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;z-index:30;
  padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.sh-head h2{font-size:18px;min-width:0;overflow-wrap:anywhere}
.x{flex:none;width:44px;height:44px;border:0;background:transparent;font-size:24px;line-height:1;border-radius:12px;color:var(--muted)}
.dirpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:0;padding:0;margin:10px 0 4px}
.dirpick label{position:relative;display:block}
.dirpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--muted);font-size:12px}
.dirpick input:checked + .opt.lent{border-color:var(--lent);background:var(--lent-soft)}
.dirpick input:checked + .opt.borrowed{border-color:var(--borrow);background:var(--borrow-soft)}
.dirpick input:focus-visible + .opt{outline:2px solid var(--fg);outline-offset:2px}
.field{display:grid;gap:6px;margin-top:14px;min-width:0}
.calc-toggle{margin-top:12px;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--fg);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.calc{margin-top:6px;padding:14px;border-radius:var(--r);background:var(--surface-2);display:grid;gap:0}
.calc > .field:first-child{margin-top:0}
.calc .btn.primary{margin-top:14px;width:100%}
.stepper{display:flex;gap:8px;align-items:stretch}
.stepper .btn{flex:none;min-width:48px;padding:0;font-size:20px}
.stepper input{flex:1;min-width:0;text-align:center;font-family:var(--font-num);font-size:18px}
.calc-res{margin:14px 0 0;display:grid;gap:2px;font-size:14px;color:var(--muted)}
.calc-res b{font-family:var(--font-num);font-weight:500;font-size:26px;color:var(--fg);font-variant-numeric:tabular-nums;margin-left:4px}
.calc-res small{font-size:12px;color:var(--muted)}
.field > .lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field > label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field input{width:100%;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);font-size:16px}
.field .yen{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.field .yen:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.field .yen span{padding-left:14px;font-family:var(--font-num);color:var(--muted);font-size:18px}
.field .yen input{border:0;background:transparent;flex:1;font-family:var(--font-num);font-size:18px}
.field .yen input:focus-visible{outline:none}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.split{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--surface-2)}
.split .row2{gap:12px}
.split .field{margin-top:0}
.split .quick{margin-top:12px}
.split .chip{background:var(--surface)}
.split .chip[aria-pressed="true"]{background:var(--primary)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.stepper button{flex:none;width:44px;min-height:48px;border:0;background:transparent;font-size:20px;color:var(--muted)}
.field .stepper input{flex:1;min-width:0;border:0;border-radius:0;text-align:center;font-family:var(--font-num);font-size:18px;background:transparent}
.field .stepper input:focus-visible{outline:none}
.split-res{margin-top:12px;font-size:13px;color:var(--muted);min-height:3.2em}
.split-res b{display:block;font-family:var(--font-num);font-size:22px;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.split > .btn{width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{min-height:1.4em;margin-top:10px;color:var(--danger);font-size:13px;font-weight:700}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.actions .primary{flex:1 1 140px}

.d-rem{display:flex;align-items:baseline;gap:10px;margin:8px 0 0}
.d-rem .lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.d-rem .amt{font-family:var(--font-num);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.d-rem.lent .amt{color:var(--lent)}
.d-rem.borrowed .amt{color:var(--borrow)}
.d-rem.done .amt{color:var(--muted);font-family:var(--font-ui);font-size:24px;font-weight:700}
.d-prog{font-size:13px;color:var(--muted);margin-top:6px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0 0;font-size:14px}
.info dt{color:var(--muted);font-size:12px;font-weight:700;padding-top:2px}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sub-h{margin:20px 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.pays{list-style:none;margin:0;padding:0}
.pays li{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.pays .pd{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.pays .pa{flex:1;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pays button{min-height:40px;padding:0 8px;border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
.none{color:var(--muted);font-size:13px;padding:6px 0}
.payform{margin-top:6px;padding:14px;border-radius:var(--r);background:var(--surface-2)}
.payform .field:first-child{margin-top:0}
.payform .amtrow{display:flex;gap:8px;align-items:stretch}
.payform .amtrow .yen{flex:1;min-width:0}
.payform .actions{margin-top:12px}
.d-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.d-foot p{flex:1 1 100%;font-size:14px}
.d-foot .btn{flex:1 1 120px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:40;
  max-width:min(92vw,420px);display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;
  background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.toast button{min-height:36px;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1>貸し借りメモ</h1>
    <p class="today" id="today"></p>
  </header>
  <section class="summary" id="summary" aria-label="残高の合計"></section>
  <section id="dueAlert" hidden aria-label="返済期限が近い記録"></section>
  <div id="sampleBanner" hidden></div>
  <div id="controls" hidden>
    <div class="seg" role="group" aria-label="表示の切り替え">
      <button type="button" data-action="view" data-v="loans" aria-pressed="true">貸し借り</button>
      <button type="button" data-action="view" data-v="people" aria-pressed="false">人別</button>
    </div>
    <div class="chips" id="filters" role="group" aria-label="絞り込み"></div>
  </div>
  <main id="content"></main>
  <p class="foot" id="foot"></p>
</div>
<button type="button" class="fab" id="fab" data-action="new">＋ 貸し借りを記録</button>
<div class="backdrop" id="backdrop" data-action="close" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<datalist id="people"></datalist>

<script>
(function(){
'use strict';
const KEY='kashikari.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('ja-JP');
const yen=n=>'¥'+fmt.format(n);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const WD='日月火水木金土';
const fmtDate=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const parseAmt=s=>{const t=String(s).normalize('NFKC').replace(/[^\d]/g,'');return t?parseInt(t,10):0};
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const S={loans:[],loaded:false,error:null,mode:'pending',memoryOnly:false,view:'loans',dir:'all',settled:false,person:null,sheet:null,confirmDel:false,opener:null,paySettled:null,toastAct:null};

const paidOf=l=>l.payments.reduce((a,p)=>a+p.amount,0);
const remOf=l=>Math.max(0,l.amount-paidOf(l));
const find=id=>S.loans.find(x=>x.id===id);

function norm(id,d){
  if(!d||(d.dir!=='lent'&&d.dir!=='borrowed')||!Number.isFinite(d.amount)||!d.person)return null;
  return {
    id:id,dir:d.dir,person:String(d.person),amount:d.amount,date:d.date||today(),due:d.due||'',note:d.note||'',
    payments:(Array.isArray(d.payments)?d.payments:[]).filter(p=>p&&Number.isFinite(p.amount)).map(p=>({id:p.id||rid('p'),amount:p.amount,date:p.date||today()})),
    createdAt:d.createdAt||0,sample:!!d.sample
  };
}
function toData(l){
  const o={dir:l.dir,person:l.person,amount:l.amount,date:l.date,due:l.due||'',note:l.note||'',payments:l.payments,createdAt:l.createdAt||Date.now()};
  if(l.sample)o.sample=true;
  return o;
}

/* ---------- storage ---------- */
const store={save:async()=>{},remove:async()=>{}};
const queues=new Map();
function enqueue(id,fn){
  const prev=queues.get(id)||Promise.resolve();
  const next=prev.catch(()=>{}).then(fn);
  queues.set(id,next);
  return next;
}
function lsRead(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function lsWrite(){
  try{localStorage.setItem(KEY,JSON.stringify(S.loans.map(l=>Object.assign({id:l.id},toData(l)))));S.memoryOnly=false}
  catch(e){S.memoryOnly=true}
}
async function initStore(){
  let db=null,uid=null;
  try{
    if(window.claude&&window.claude.use){
      const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=r[0];
      uid=r[1]?await r[1].id():null;
    }
  }catch(e){db=null;uid=null}
  if(db&&uid){
    try{
      const col=db.collection('data/users/'+uid);
      S.mode='cloud';
      store.save=loan=>enqueue(loan.id,()=>col.doc(loan.id).set(toData(loan)));
      store.remove=id=>enqueue(id,()=>col.doc(id).delete());
      col.onSnapshot(snap=>{
        S.loans=snap.docs.filter(d=>d.exists).map(d=>norm(d.id,d.data())).filter(Boolean);
        S.loaded=true;S.error=null;render();
      },err=>{S.error=err||true;S.loaded=true;render()});
      return;
    }catch(e){}
  }
  S.mode='local';
  S.loans=lsRead().map(d=>norm(d.id||rid('l'),d)).filter(Boolean);
  S.loaded=true;
  store.save=async loan=>{
    const i=S.loans.findIndex(x=>x.id===loan.id);
    if(i>=0)S.loans[i]=loan;else S.loans.push(loan);
    lsWrite();render();
  };
  store.remove=async id=>{S.loans=S.loans.filter(x=>x.id!==id);lsWrite();render()};
  render();
}
async function persist(loan,okMsg){
  try{await store.save(loan);if(okMsg)toast(okMsg);return true}
  catch(e){toast('保存できませんでした。もう一度お試しください。');return false}
}

/* ---------- derived ---------- */
function totals(){
  let lent=0,bor=0,over=0;const t=today();
  for(const l of S.loans){
    const r=remOf(l);if(!r)continue;
    if(l.dir==='lent')lent+=r;else bor+=r;
    if(l.due&&diff(t,l.due)<0)over++;
  }
  return {lent:lent,bor:bor,over:over};
}
function visibleLoans(){
  return S.loans.filter(l=>(S.dir==='all'||l.dir===S.dir)&&(!S.person||l.person===S.person)&&(S.settled||remOf(l)>0));
}
const sortOpen=(a,b)=>{
  const ad=a.due||'9999-99-99',bd=b.due||'9999-99-99';
  if(ad!==bd)return ad<bd?-1:1;
  return b.date.localeCompare(a.date)||b.createdAt-a.createdAt;
};
const sortDone=(a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt;

/* ---------- render ---------- */
function render(){
  $('#today').textContent=(()=>{const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')'})();
  renderSummary();renderDue();renderBanner();renderControls();renderContent();renderFoot();
  const dl=$('#people');
  dl.innerHTML=Array.from(new Set(S.loans.filter(l=>remOf(l)>0).map(l=>l.person))).map(n=>'<option value="'+esc(n)+'"></option>').join('');
  if(S.sheet&&S.sheet.type==='detail')renderDetailBody();
}
function renderSummary(){
  const el=$('#summary');
  if(!S.loaded){
    el.innerHTML='<div class="sum-col lent"><div class="lbl">貸している</div><div class="amt dim">¥ --</div><div class="sub">返してもらう分</div></div>'+
      '<div class="sum-col borrowed"><div class="lbl">借りている</div><div class="amt dim">¥ --</div><div class="sub">返す分</div></div>';
    return;
  }
  const t=totals(),net=t.lent-t.bor;
  let netHtml;
  if(net>0)netHtml='<span class="net-v lent">受け取りが <b>'+yen(net)+'</b> 多い</span>';
  else if(net<0)netHtml='<span class="net-v borrowed">返す分が <b>'+yen(-net)+'</b> 多い</span>';
  else netHtml='<span class="net-v">貸し借りは釣り合っています</span>';
  el.innerHTML=
    '<div class="sum-col lent"><div class="lbl">貸している</div><div class="amt">'+yen(t.lent)+'</div><div class="sub">返してもらう分</div></div>'+
    '<div class="sum-col borrowed"><div class="lbl">借りている</div><div class="amt">'+yen(t.bor)+'</div><div class="sub">返す分</div></div>'+
    '<div class="sum-net"><span class="net-l">差し引き</span>'+netHtml+(t.over?'<span class="pill over">期限超過 '+t.over+'件</span>':'')+'</div>';
}
function renderDue(){
  const el=$('#dueAlert');
  const t=today(),tm=addDays(t,1);
  const items=S.loaded&&!S.error?S.loans.filter(l=>remOf(l)>0&&(l.due===t||l.due===tm)):[];
  el.hidden=!items.length;
  if(!items.length){el.innerHTML='';return}
  const row=l=>{
    const lent=l.dir==='lent';
    return '<button type="button" class="due-row" data-action="open" data-id="'+esc(l.id)+'"><span class="tag '+(lent?'lent':'borrowed')+'">'+(lent?'貸':'借')+'</span>'+
      '<span class="due-t">'+esc(l.person)+(lent?' から受け取る':' に返す')+'</span><span class="rem">'+yen(remOf(l))+'</span></button>';
  };
  const grp=(d,label)=>{
    const a=items.filter(l=>l.due===d).sort((x,y)=>x.person.localeCompare(y.person,'ja'));
    return a.length?'<h2 class="due-h">'+label+'<span>'+fmtDate(d)+'</span></h2>'+a.map(row).join(''):'';
  };
  el.innerHTML='<div class="due">'+grp(t,'今日が返済期限')+grp(tm,'明日が返済期限')+'</div>';
}
function renderBanner(){
  const el=$('#sampleBanner');
  const has=S.loaded&&S.loans.some(l=>l.sample);
  el.hidden=!has;
  if(has)el.innerHTML='<div class="banner"><p>いまの表示にはサンプルの記録が含まれています。</p><button type="button" class="btn small" data-action="rmSample">サンプルを削除</button></div>';
}
function renderControls(){
  const show=S.loaded&&!S.error&&S.loans.length>0;
  $('#controls').hidden=!show;
  if(!show)return;
  const people=S.view==='people';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.view)));
  let h='';
  if(!people){
    h+=[['all','すべて'],['lent','貸した'],['borrowed','借りた']].map(a=>'<button type="button" class="chip" data-action="dir" data-v="'+a[0]+'" aria-pressed="'+(S.dir===a[0])+'">'+a[1]+'</button>').join('');
  }
  if(!people)h+='<button type="button" class="chip" data-action="settled" aria-pressed="'+S.settled+'">完済も表示</button>';
  if(S.person&&!people)h+='<button type="button" class="chip person" data-action="clearPerson" aria-label="'+esc(S.person)+'の絞り込みを解除">'+esc(S.person)+' ×</button>';
  $('#filters').innerHTML=h;
  $('#filters').hidden=!h;
}
function loanCard(l){
  const rem=remOf(l),paid=paidOf(l),lent=l.dir==='lent',cls=lent?'lent':'borrowed',t=today();
  const done=rem===0;
  let pill='',left=[];
  if(!done){
    if(paid>0)left.push(yen(paid)+' 返済済み(全体 '+yen(l.amount)+')');
    if(l.due){
      left.push('期限 '+fmtDate(l.due));
      const d=diff(t,l.due);
      if(d<0)pill='<span class="pill over">'+(-d)+'日超過</span>';
      else if(d===0)pill='<span class="pill soon">今日が期限</span>';
      else if(d<=7)pill='<span class="pill soon">あと'+d+'日</span>';
    }
  }
  const bar=(!done&&paid>0)?'<span class="bar"><i style="width:'+Math.min(100,Math.round(paid/l.amount*100))+'%"></i></span>':'';
  const foot=(left.length||pill)?'<span class="l-foot"><span>'+esc(left.join(' ・ '))+'</span>'+pill+'</span>':'';
  return '<button type="button" class="loan dir-'+cls+(done?' done':'')+'" data-action="open" data-id="'+esc(l.id)+'">'+
    '<span class="l-top"><span class="tag '+cls+'">'+(lent?'貸':'借')+'</span><span class="who">'+esc(l.person)+'</span><span class="rem">'+(done?'完済':yen(rem))+'</span></span>'+
    '<span class="l-sub"><span class="note">'+esc(done?(yen(l.amount)+(l.note?' ・ '+l.note:'')):l.note)+'</span><span class="date">'+fmtDate(l.date)+'</span></span>'+
    bar+foot+'</button>';
}
function loansHtml(){
  const vis=visibleLoans();
  if(!vis.length){
    return '<div class="empty"><h2>この条件に合う記録はありません</h2><p>絞り込みを変えるか、「完済も表示」をオンにしてください。</p></div>';
  }
  const open=vis.filter(l=>remOf(l)>0).sort(sortOpen),done=vis.filter(l=>remOf(l)===0).sort(sortDone);
  let h='';
  if(open.length)h+='<h2 class="sec">未返済<span>'+open.length+'件</span></h2><div class="list">'+open.map(loanCard).join('')+'</div>';
  if(done.length)h+='<h2 class="sec">完済<span>'+done.length+'件</span></h2><div class="list">'+done.map(loanCard).join('')+'</div>';
  return h;
}
function peopleHtml(){
  const m=new Map();
  for(const l of S.loans){
    const r=remOf(l);
    if(!r)continue;
    let p=m.get(l.person);
    if(!p){p={name:l.person,net:0,nl:0,nb:0};m.set(l.person,p)}
    if(r){if(l.dir==='lent'){p.net+=r;p.nl++}else{p.net-=r;p.nb++}}
  }
  const rows=Array.from(m.values()).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net)||a.name.localeCompare(b.name,'ja'));
  if(!rows.length)return '<div class="empty"><h2>未返済の相手はいません</h2><p>すべて完済しています。</p></div>';
  return '<h2 class="sec">相手ごとの差し引き<span>'+rows.length+'人</span></h2><div class="list">'+rows.map(p=>{
    const sub=[p.nl?'貸し'+p.nl+'件':'',p.nb?'借り'+p.nb+'件':''].filter(Boolean).join(' ・ ')||'清算済み';
    let net;
    if(p.net>0)net='<span class="p-net lent"><b>'+yen(p.net)+'</b><small>返してもらう</small></span>';
    else if(p.net<0)net='<span class="p-net borrowed"><b>'+yen(-p.net)+'</b><small>返す</small></span>';
    else net='<span class="p-net"><b>¥0</b><small>差し引きなし</small></span>';
    return '<button type="button" class="person-row" data-action="person" data-name="'+esc(p.name)+'">'+
      '<span class="avatar">'+esc(Array.from(p.name)[0])+'</span>'+
      '<span class="p-main"><span class="who">'+esc(p.name)+'</span><span class="p-sub">'+esc(sub)+'</span></span>'+net+'</button>';
  }).join('')+'</div>';
}
function renderContent(){
  const c=$('#content');
  if(S.error){
    c.innerHTML='<div class="empty"><h2>記録を読み込めませんでした</h2><p>ページを開き直してください。直らないときは、少し時間をおいてからもう一度お試しください。</p></div>';
    return;
  }
  if(!S.loaded){c.innerHTML='<div class="skel" aria-hidden="true"><div></div><div></div><div></div></div>';return}
  if(!S.loans.length){
    c.innerHTML='<div class="empty"><h2>まだ記録がありません</h2><p>貸したお金、借りたお金を記録すると、相手ごとの残りと返済期限がここに並びます。</p>'+
      '<div class="row"><button type="button" class="btn primary" data-action="new">最初の1件を記録</button><button type="button" class="btn" data-action="sample">サンプルを入れて試す</button></div></div>';
    return;
  }
  c.innerHTML=S.view==='people'?peopleHtml():loansHtml();
}
function renderFoot(){
  const f=$('#foot');
  if(!S.loaded||S.error){f.textContent='';return}
  if(S.mode==='cloud')f.textContent='記録はあなたのアカウントにだけ保存されます。他の人には見えません。';
  else f.textContent='記録はこの端末のブラウザにだけ保存されます。ブラウザのデータを消すと失われます。'+(S.memoryOnly?' いまは保存できない状態なので、ページを閉じると消えます。':'');
}

function openSheet(s){
  S.sheet=s;S.confirmDel=false;S.calDays=null;S.paySettled=null;S.split=(s.preset&&s.preset.split)||null;S.opener=document.activeElement;
  $('#sheet').hidden=false;$('#backdrop').hidden=false;
  $('#app').inert=true;$('#fab').inert=true;document.body.style.overflow='hidden';
  if(s.type==='form')buildForm(s.id);else buildDetail(s.id);
  $('#sheet').scrollTop=0;
}
function closeSheet(){
  S.sheet=null;
  $('#sheet').hidden=true;$('#backdrop').hidden=true;$('#sheet').innerHTML='';
  $('#app').inert=false;$('#fab').inert=false;document.body.style.overflow='';
  const o=S.opener;S.opener=null;
  if(o&&document.contains(o)&&!o.disabled)o.focus();else $('#fab').focus();
}
function updateCalc(){
  const total=parseAmt($('#c-total').value);
  const n=Math.min(99,parseInt(String($('#c-n').value).normalize('NFKC'),10)||0);
  const u=S.calcUnit||1,res=$('#c-res'),btn=$('#c-apply');
  S.calcPer=0;
  if(!total||n<2){res.innerHTML='<small>合計金額と人数を入れると、1人あたりの金額が出ます。</small>';btn.disabled=true;return}
  const per=Math.ceil(total/(n*u))*u,extra=per*n-total;
  S.calcPer=per;S.calcTotal=total;S.calcN=n;
  res.innerHTML='1人あたり <b>'+yen(per)+'</b><small>'+(extra>0?n+'人分の合計は '+yen(per*n)+'(合計より '+yen(extra)+' 多くなります)':'ちょうど割り切れます')+'</small>';
  btn.disabled=false;
}

  '<button type="button" class="chip" data-action="due" data-d="m1">1か月後</button>'+
  '<button type="button" class="chip" data-action="due" data-d="none">期限なし</button></div>'+
  '<div class="field"><label for="f-note">メモ(任意)</label><input id="f-note" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="例: 飲み会の立て替え" value="'+esc(v.note)+'"></div>'+
  '<p class="err" id="f-err" role="alert"></p>'+
  '<div class="actions"><button type="button" class="btn" data-action="close">キャンセル</button><button type="submit" class="btn primary">保存</button></div></form>';
  setTimeout(()=>{const n=$('#f-name');if(n&&!l)n.focus()},50);
}
function buildDetail(id){
  $('#sheet').innerHTML='<div class="grab"></div><div id="dBody"></div><div id="dPay"></div><div class="d-foot" id="dFoot"></div>';
  renderDetailBody();
  const t=$('#sheetTitle');if(t){t.tabIndex=-1;t.focus()}
}
function renderDetailBody(){
  const l=find(S.sheet.id);
  if(!l){closeSheet();return}
  const paid=paidOf(l),rem=remOf(l),lent=l.dir==='lent',cls=lent?'lent':'borrowed',done=rem===0,t=today();
  let dueTxt='なし';
  if(l.due){
    dueTxt=fmtDate(l.due);
    if(!done){const d=diff(t,l.due);dueTxt+=d<0?'(期限超過 '+(-d)+'日)':d===0?'(今日)':'(あと'+d+'日)'}
  }
  const pays=l.payments.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const pct=Math.min(100,Math.round(paid/l.amount*100));
  let calHtml='';
  if(l.due&&!done&&l.due>=t){
    const cd=s=>s.replace(/-/g,'');
    if(!Array.isArray(S.calDays)){const y=addDays(l.due,-1);S.calDays=[y<t?l.due:y]}
    S.calDays=Array.from(new Set(S.calDays.filter(d=>d>=t&&d<=l.due))).sort();
    const days=S.calDays;
    const mkHref=day=>{
      const n=diff(day,l.due);
      const prefix=n===0?'【今日が返済期限】':n===1?'【明日が期限】':'【期限まであと'+n+'日】';
      const title=prefix+l.person+(lent?' から '+yen(rem)+' を受け取る':' に '+yen(rem)+' を返す');
      const details='貸し借りメモ'+(l.note?'\n'+l.note:'')+'\n返済期限: '+fmtDate(l.due);
      return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+cd(day)+'/'+cd(addDays(day,1))+'&details='+encodeURIComponent(details);
    };
    const chips=[[0,'当日'],[1,'1日前'],[2,'2日前'],[3,'3日前'],[7,'1週間前']].filter(o=>addDays(l.due,-o[0])>=t).map(o=>{
      const d=addDays(l.due,-o[0]);
      return '<button type="button" class="chip" data-action="calDay" data-day="'+d+'" aria-pressed="'+days.includes(d)+'">'+o[1]+'</button>';
    }).join('');
    const rows=days.length?'<ul class="cal-list">'+days.map(d=>{
      const n=diff(d,l.due);
      return '<li class="cal-row"><span class="cd">'+fmtDate(d)+'<small>'+(n===0?'返済期限の当日':'返済期限の'+n+'日前')+'</small></span>'+
        '<a class="btn small primary" href="'+esc(mkHref(d))+'" target="_blank" rel="noopener">カレンダーに追加</a>'+
        '<button type="button" class="rm" data-action="calRm" data-day="'+d+'" aria-label="'+fmtDate(d)+'を選択から外す">×</button></li>';
    }).join('')+'</ul>':'<p class="none">通知する日を選んでください。</p>';
    calHtml='<h3 class="sub-h">カレンダーに追加</h3><div class="chips cal-links" role="group" aria-label="通知する日をすばやく選ぶ(複数選べます)">'+chips+'</div>'+
      '<div class="field"><label for="c-day">ほかの日を追加</label><input type="date" id="c-day" min="'+t+'" max="'+l.due+'" value=""></div>'+
      rows+
      '<p class="none">日ごとにボタンを押すと、Googleカレンダーが開きます。通知の時刻はカレンダー側の設定に従います。</p>';
  }
  $('#dBody').innerHTML=
    '<div class="sh-head"><div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="tag '+cls+'">'+(lent?'貸':'借')+'</span><h2 id="sheetTitle">'+esc(l.person)+'</h2></div><button type="button" class="x" data-action="close" aria-label="閉じる">×</button></div>'+
    '<p class="d-rem '+cls+(done?' done':'')+'"><span class="lbl">'+(done?'状態':'残り')+'</span><span class="amt">'+(done?'完済':yen(rem))+'</span></p>'+
    '<div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div>'+
    '<p class="d-prog">全体 '+yen(l.amount)+' のうち '+yen(paid)+' '+(lent?'返してもらいました':'返しました')+'</p>'+
    '<dl class="info"><dt>'+(lent?'貸した日':'借りた日')+'</dt><dd>'+fmtDate(l.date)+'</dd><dt>返済期限</dt><dd>'+esc(dueTxt)+'</dd>'+(l.note?'<dt>メモ</dt><dd>'+esc(l.note)+'</dd>':'')+'</dl>'+
    calHtml+
    '<h3 class="sub-h">'+(lent?'返してもらった記録':'返した記録')+'</h3>'+
    (pays.length?'<ul class="pays">'+pays.map(p=>'<li><span class="pd">'+fmtDate(p.date)+'</span><span class="pa">'+yen(p.amount)+'</span><button type="button" data-action="delPay" data-pid="'+esc(p.id)+'" aria-label="'+fmtDate(p.date)+'の'+yen(p.amount)+'を削除">削除</button></li>').join('')+'</ul>':'<p class="none">まだ返済の記録はありません。</p>');
  if(S.paySettled!==done){
    S.paySettled=done;
    $('#dPay').innerHTML=done?'':
      '<form class="payform" id="payForm" novalidate><div class="field"><label for="p-amount">'+(lent?'返してもらった金額':'返した金額')+'</label>'+
      '<div class="amtrow"><div class="yen"><span>¥</span><input id="p-amount" data-amt inputmode="numeric" autocomplete="off" placeholder="0"></div><button type="button" class="btn" data-action="payAll">残り全額</button></div></div>'+
      '<div class="field"><label for="p-date">日付</label><input type="date" id="p-date" value="'+today()+'"></div>'+
      '<p class="err" id="p-err" role="alert"></p><div class="actions"><button type="submit" class="btn primary">返済を記録</button></div></form>';
  }
  $('#dFoot').innerHTML=S.confirmDel?
    '<p>「'+esc(l.person)+' '+yen(l.amount)+'」の記録を削除します。返済の記録もすべて消え、元に戻せません。</p><button type="button" class="btn" data-action="cancelDel">やめる</button><button type="button" class="btn danger-solid" data-action="doDel">削除する</button>':
    '<button type="button" class="btn" data-action="edit">編集</button><button type="button" class="btn danger" data-action="askDel">削除</button>';
}

/* ---------- actions ---------- */
async function submitLoan(){
  const f=$('#loanForm'),err=m=>{$('#f-err').textContent=m};
  const dir=f.elements.dir.value;
  const person=$('#f-name').value.replace(/\s+/g,' ').trim();
  const amount=parseAmt($('#f-amount').value);
  const date=$('#f-date').value,due=$('#f-due').value,note=$('#f-note').value.trim();
  const old=S.sheet&&S.sheet.id?find(S.sheet.id):null;
  if(!person)return err('相手の名前を入力してください。');
  if(!amount)return err('金額を入力してください。');
  if(amount>999999999)return err('金額は999,999,999円までです。');
  if(!date)return err('日付を入力してください。');
  if(due&&due<date)return err('返済期限は日付以降にしてください。');
  if(old&&amount<paidOf(old))return err('返済済みの合計('+yen(paidOf(old))+')より少なくできません。');
  const loan={id:old?old.id:rid('l'),dir:dir,person:person,amount:amount,date:date,due:due,note:note,payments:old?old.payments:[],createdAt:old?old.createdAt:Date.now(),sample:old?old.sample:false};
  const fromSplit=!old&&S.split&&S.split.amount===amount;
  closeSheet();
  const ok=await persist(loan);
  if(!ok)return;
  if(fromSplit)toast('記録しました',{label:'次の人を記録',fn:()=>openSheet({type:'form',preset:{dir:dir,amount:amount,date:date,due:due,note:note,split:{amount:amount}}})});
  else toast('記録しました');
}
async function submitPay(){
  const err=m=>{$('#p-err').textContent=m};
  const l=find(S.sheet.id);if(!l)return;
  const amt=parseAmt($('#p-amount').value),date=$('#p-date').value,rem=remOf(l);
  if(!amt)return err('金額を入力してください。');
  if(amt>rem)return err('残りは '+yen(rem)+' です。');
  if(!date)return err('日付を入力してください。');
  err('');
  const next=Object.assign({},l,{payments:l.payments.concat([{id:rid('p'),amount:amt,date:date}])});
  $('#p-amount').value='';
  await persist(next,amt===rem?'完済になりました':'返済を記録しました');
}
function sampleLoans(){
  const t=today(),mk=(o)=>Object.assign({id:rid('l'),note:'',due:'',payments:[],createdAt:Date.now(),sample:true},o);
  return [
    mk({dir:'lent',person:'田中',amount:12000,date:addDays(t,-20),due:addDays(t,-3),note:'飲み会の立て替え',payments:[{id:rid('p'),amount:4000,date:addDays(t,-10)}]}),
    mk({dir:'lent',person:'佐藤',amount:30000,date:addDays(t,-6),due:addDays(t,24),note:'引っ越しの初期費用'}),
    mk({dir:'borrowed',person:'山本',amount:5000,date:addDays(t,-4),due:addDays(t,3),note:'ライブのチケット代'}),
    mk({dir:'borrowed',person:'田中',amount:2000,date:addDays(t,-2),note:'タクシー代'}),
    mk({dir:'lent',person:'佐藤',amount:3000,date:addDays(t,-30),note:'ランチ代',payments:[{id:rid('p'),amount:3000,date:addDays(t,-25)}]})
  ];
}
function calcSplit(){
  const sp=$('#split');if(!sp)return null;
  const res=$('#s-res'),use=$('#s-use');
  const total=parseAmt($('#s-total').value);
  const n=parseInt(String($('#s-n').value).normalize('NFKC').replace(/[^\d]/g,''),10)||0;
  const unit=parseInt(sp.dataset.unit,10),up=sp.dataset.mode==='up';
  const off=m=>{res.textContent=m;use.disabled=true;return null};
  if(!total)return off('合計金額を入力すると、1人あたりの金額が出ます。');
  if(total>999999999)return off('合計金額は999,999,999円までです。');
  if(n<2)return off('人数は2人以上にしてください。');
  const q=total/(n*unit);
  const per=(up?Math.ceil(q):Math.floor(q))*unit;
  if(per<1)return off('1人あたりの金額が0円になります。切り上げにするか、単位を小さくしてください。');
  const d=per*n-total;
  res.innerHTML='<b>1人あたり '+yen(per)+'</b>'+yen(total)+' ÷ '+n+'人'+(d===0?'でちょうど割り切れます。':'。'+n+'人分では合計より '+yen(Math.abs(d))+(d>0?' 多く':' 少なく')+'なります。');
  use.disabled=false;
  return {per:per,total:total,n:n};
}
let tt;
function toast(msg,act){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(act?'<button type="button" data-action="toastAct">'+esc(act.label)+'</button>':'');
  S.toastAct=act?act.fn:null;
  t.hidden=false;clearTimeout(tt);
  tt=setTimeout(()=>{t.hidden=true},act?8000:2600);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action;
  switch(a){
    case 'view':S.view=b.dataset.v;render();break;
    case 'dir':S.dir=b.dataset.v;render();break;
    case 'settled':S.settled=!S.settled;render();break;
    case 'clearPerson':S.person=null;render();break;
    case 'person':S.person=b.dataset.name;S.view='loans';S.dir='all';render();window.scrollTo(0,0);break;
    case 'new':openSheet({type:'form'});break;
    case 'open':openSheet({type:'detail',id:b.dataset.id});break;
    case 'close':closeSheet();break;
    case 'edit':{const id=S.sheet.id;S.opener=null;closeSheet();openSheet({type:'form',id:id});break}
    case 'calDay':{
      const d=b.dataset.day,a=Array.isArray(S.calDays)?S.calDays:[];
      S.calDays=a.includes(d)?a.filter(x=>x!==d):a.concat([d]);
      renderDetailBody();break;
    }
    case 'calRm':S.calDays=(S.calDays||[]).filter(x=>x!==b.dataset.day);renderDetailBody();break;
    case 'askDel':S.confirmDel=true;renderDetailBody();break;
    case 'cancelDel':S.confirmDel=false;renderDetailBody();break;
    case 'doDel':{
      const l=find(S.sheet.id);if(!l)break;
      closeSheet();
      try{await store.remove(l.id);toast('削除しました',{label:'元に戻す',fn:()=>persist(l,'元に戻しました')})}
      catch(err){toast('削除できませんでした。もう一度お試しください。')}
      break;
    }
    case 'delPay':{
      const l=find(S.sheet.id);if(!l)break;
      const next=Object.assign({},l,{payments:l.payments.filter(p=>p.id!==b.dataset.pid)});
      if(await persist(next))toast('返済の記録を削除しました',{label:'元に戻す',fn:()=>persist(l,'元に戻しました')});
      break;
    }
    case 'payAll':{const l=find(S.sheet.id);if(l){const i=$('#p-amount');i.value=fmt.format(remOf(l));i.focus()}break}
    case 'calcToggle':{
      const p=$('#calc');p.hidden=!p.hidden;
      b.setAttribute('aria-expanded',String(!p.hidden));
      b.textContent=p.hidden?'割り勘電卓で計算する':'割り勘電卓を閉じる';
      if(!p.hidden){updateCalc();$('#c-total').focus()}
      break;
    }
    case 'nStep':{
      const i=$('#c-n');
      const n=Math.min(99,Math.max(2,(parseInt(String(i.value).normalize('NFKC'),10)||2)+parseInt(b.dataset.d,10)));
      i.value=n;updateCalc();break;
    }
    case 'rnd':
      S.calcUnit=parseInt(b.dataset.u,10);
      document.querySelectorAll('[data-action="rnd"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      updateCalc();break;
    case 'applyCalc':{
      if(!S.calcPer)break;
      $('#f-amount').value=fmt.format(S.calcPer);
      const nt=$('#f-note');
      if(!nt.value.trim())nt.value='割り勘 '+yen(S.calcTotal)+' ÷ '+S.calcN+'人';
      $('#f-err').textContent='';
      const p=$('#calc'),t=$('#calcToggle');
      p.hidden=true;t.setAttribute('aria-expanded','false');t.textContent='割り勘電卓で計算する';
      $('#f-amount').focus();
      break;
    }
    case 'due':{
      const base=$('#f-date').value||today(),d=b.dataset.d;
      $('#f-due').value=d==='none'?'':d==='m1'?addMonths(base,1):addDays(base,parseInt(d,10));
      break;
    }
    case 'sample':
      try{await Promise.all(sampleLoans().map(l=>store.save(l)));toast('サンプルを入れました')}
      catch(err){toast('保存できませんでした。もう一度お試しください。')}
      break;
    case 'rmSample':
      try{await Promise.all(S.loans.filter(l=>l.sample).map(l=>store.remove(l.id)));toast('サンプルを削除しました')}
      catch(err){toast('削除できませんでした。もう一度お試しください。')}
      break;
    case 'toggleSplit':{
      const sp=$('#split'),willOpen=sp.hidden;
      sp.hidden=!willOpen;b.setAttribute('aria-expanded',String(willOpen));
      if(willOpen){calcSplit();$('#s-total').focus()}
      break;
    }
    case 'nDec':case 'nInc':{
      const i=$('#s-n');
      let n=parseInt(String(i.value).normalize('NFKC').replace(/[^\d]/g,''),10)||2;
      n=Math.min(99,Math.max(2,n+(a==='nInc'?1:-1)));
      i.value=n;calcSplit();break;
    }
    case 'mode':case 'unit':{
      const sp=$('#split');
      sp.dataset[a]=b.dataset.v;
      sp.querySelectorAll('[data-action="'+a+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      calcSplit();break;
    }
    case 'useSplit':{
      const r=calcSplit();if(!r)break;
      $('#f-amount').value=fmt.format(r.per);
      const nt=$('#f-note');
      if(!nt.value.trim())nt.value='割り勘 '+yen(r.total)+' ÷ '+r.n+'人';
      S.split={amount:r.per};
      $('#split').hidden=true;$('#splitBtn').setAttribute('aria-expanded','false');
      const nm=$('#f-name');if(!nm.value.trim())nm.focus();
      break;
    }
    case 'toastAct':{const fn=S.toastAct;S.toastAct=null;$('#toast').hidden=true;if(fn)fn();break}
  }
});
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loanForm')submitLoan();
  else if(e.target.id==='payForm')submitPay();
});
$('#sheet').addEventListener('input',e=>{
  if(e.target.closest&&e.target.closest('#calc'))updateCalc();
});
$('#sheet').addEventListener('change',e=>{
  if(e.target.id==='c-day'&&S.sheet&&S.sheet.type==='detail'){
    const v=e.target.value;
    if(v&&Array.isArray(S.calDays)&&!S.calDays.includes(v))S.calDays=S.calDays.concat([v]);
    renderDetailBody();return;
  }
  if(e.target.name==='dir'){const l=$('#f-date-l');if(l)l.textContent=e.target.value==='lent'?'貸した日':'借りた日'}
});
$('#sheet').addEventListener('focusout',e=>{
  if(e.target.matches&&e.target.matches('[data-amt]')){const n=parseAmt(e.target.value);e.target.value=n?fmt.format(n):''}
  if(e.target.id==='s-n'){const n=parseInt(String(e.target.value).normalize('NFKC').replace(/[^\d]/g,''),10)||2;e.target.value=Math.min(99,Math.max(2,n));calcSplit()}
});
$('#sheet').addEventListener('input',e=>{if(e.target.id==='s-total'||e.target.id==='s-n')calcSplit()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.loaded)render()});

render();
initStore();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js')}catch(e){}
})();
